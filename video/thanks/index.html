<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #241e22; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #241e22; color: #f2efe5; }
      .mono { font-family: "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .14em; }
      .pic { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background-size: cover; background-repeat: no-repeat; }
      #a { background-image: url(media/v130.jpg); background-position: 50% 50%; transform-origin: 27% 66%; filter: saturate(0) contrast(1.35) brightness(.8); }
      #b { background-image: url(media/p3527.jpg); background-position: 50% 70%; transform-origin: 35% 45%; filter: saturate(.9) contrast(1.05); }
      #grad { position: absolute; left: 0; top: 430px; width: 1920px; height: 650px; background: linear-gradient(180deg, rgba(27,23,26,0) 0%, rgba(27,23,26,.94) 72%); }
      #stamp { position: absolute; left: 1060px; top: 300px; font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 190px; letter-spacing: .04em; color: #f2c14e; border: 12px solid #f2c14e; padding: 6px 44px; transform: rotate(-7deg); }
      #medal { position: absolute; left: 1500px; top: 90px; width: 300px; height: 300px; border-radius: 150px; background: radial-gradient(circle at 35% 30%, #ffe9a8 0%, #f2c14e 45%, #b9861f 100%); border: 10px solid #8a6414; display: flex; align-items: center; justify-content: center; font-family: "Instrument Serif", Georgia, serif; font-size: 190px; line-height: 1; color: #6b4c0c; }
      #ribbon { position: absolute; left: 1590px; top: 0; width: 120px; height: 120px; background: #f0a18b; }
      #ty { position: absolute; left: 110px; top: 770px; font-family: "Instrument Serif", Georgia, serif; font-size: 132px; line-height: 1; }
      #ty em { color: #f0a18b; }
      #sub { position: absolute; left: 116px; top: 950px; font-size: 30px; color: #f0a18b; }
      #flash { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: #f0a18b; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2" data-width="1920" data-height="1080">
      <div id="a" class="clip pic" data-start="0" data-duration="0.7" data-track-index="0"></div>
      <div id="stamp" class="clip" data-start="0" data-duration="0.7" data-track-index="1">GOLD</div>
      <div id="b" class="clip pic" data-start="0.7" data-duration="1.3" data-track-index="2"></div>
      <div id="ribbon" class="clip" data-start="0.7" data-duration="1.3" data-track-index="7"></div>
      <div id="medal" class="clip" data-start="0.7" data-duration="1.3" data-track-index="8">1</div>
      <div id="grad" class="clip" data-start="0.7" data-duration="1.3" data-track-index="3"></div>
      <div id="ty" class="clip" data-start="0.7" data-duration="1.3" data-track-index="4">Gold medal. Thank you, <em><i>HyperFrames</i></em>.</div>
      <div id="sub" class="clip mono" data-start="0.7" data-duration="1.3" data-track-index="5">+1: acceptance speech, recorded early just in case.</div>
      <div id="flash" class="clip" data-start="0" data-duration="2" data-track-index="6"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set("#flash", { opacity: 0 }, 0);
      tl.fromTo("#a", { scale: 2.7 }, { scale: 2.95, duration: 0.7, ease: "none" }, 0);
      tl.fromTo("#stamp", { opacity: 0, scale: 2.6 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in" }, 0.08);
      tl.to("#flash", { opacity: 1, duration: 0.06 }, 0.64);
      tl.to("#flash", { opacity: 0, duration: 0.2 }, 0.7);
      tl.fromTo("#b", { scale: 1.12 }, { scale: 1.0, duration: 1.3, ease: "power2.out" }, 0.7);
      tl.fromTo("#ty", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out" }, 0.78);
      tl.fromTo("#medal", { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.3, ease: "back.out(2.2)" }, 0.8);
      tl.fromTo("#ribbon", { scaleY: 0, transformOrigin: "top center" }, { scaleY: 1, duration: 0.15 }, 0.74);
      tl.fromTo("#sub", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 1.05);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
