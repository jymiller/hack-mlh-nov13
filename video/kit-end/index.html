<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #241e22; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #241e22; color: #f2efe5; font-family: "DM Sans", Arial, sans-serif; }
      .mono { font-family: "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .16em; font-size: 28px; }
      #block { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: #f0a18b; }
      #pres { position: absolute; left: 140px; top: 150px; color: #f0a18b; }
      #site { position: absolute; right: 140px; top: 150px; color: #c5bcc0; }
      #rule { position: absolute; left: 140px; top: 212px; width: 1640px; height: 2px; background: #57494f; transform-origin: left center; }
      #jay { position: absolute; left: 132px; top: 290px; font-family: "Instrument Serif", Georgia, serif; font-size: 360px; line-height: 1; letter-spacing: -.02em; }
      #plus { color: #f0a18b; display: inline-block; }
      #fn { position: absolute; left: 140px; top: 660px; font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-size: 180px; line-height: 1; color: #f0a18b; }
      #tag { position: absolute; left: 140px; top: 925px; color: #c5bcc0; }
      #e1 { position: absolute; left: 0; top: 300px; width: 1920px; text-align: center; font-family: "Instrument Serif", Georgia, serif; font-size: 260px; line-height: 1; }
      #e1 em { color: #f0a18b; font-style: normal; }
      #e0 { position: absolute; left: 0; top: 220px; width: 1920px; text-align: center; color: #c5bcc0; }
      #e2 { position: absolute; left: 0; top: 640px; width: 1920px; text-align: center; color: #f0a18b; font-size: 36px; }
      #e3 { position: absolute; left: 0; top: 730px; width: 1920px; text-align: center; color: #c5bcc0; }
      #e4 { position: absolute; left: 0; top: 800px; width: 1920px; text-align: center; color: #c5bcc0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div id="e0" class="clip mono" data-start="0" data-duration="5" data-track-index="0">One person, plus one intelligence</div>
      <div id="e1" class="clip" data-start="0" data-duration="5" data-track-index="1">Jay<em>+</em>1</div>
      <div id="e2" class="clip mono" data-start="0" data-duration="5" data-track-index="2">youtube.com/@jayplusone</div>
      <div id="e3" class="clip mono" data-start="0" data-duration="5" data-track-index="3">A Milbird Media production</div>
      <div id="e4" class="clip mono" data-start="0" data-duration="5" data-track-index="4">milbird.com</div>
      <div id="block" class="clip" data-start="0" data-duration="5" data-track-index="5"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set("#block", { scaleX: 1, transformOrigin: "right center" }, 0);
      tl.to("#block", { scaleX: 0, duration: 0.55, ease: "power4.out" }, 0.15);
      tl.fromTo("#e1", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 0.4);
      tl.fromTo(["#e0", "#e2", "#e3", "#e4"], { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, stagger: 0.15, ease: "power2.out" }, 0.8);
      tl.to("#e1", { scale: 1.03, duration: 3.4, ease: "none" }, 1.4);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
